name: Weekly Rebuild for Blog Publication
on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_WEEKLY_REBUILD_HOOK: ${{ secrets.VERCEL_WEEKLY_REBUILD_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_WEEKLY_REBUILD_HOOK" ]; then
            echo "VERCEL_WEEKLY_REBUILD_HOOK is not configured." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 2 --retry-max-time 30 \
            --request POST --output /dev/null \
            "$VERCEL_WEEKLY_REBUILD_HOOK"
