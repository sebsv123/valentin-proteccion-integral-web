name: Weekly Rebuild for Blog Publication
on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_WEEKLY_REBUILD_HOOK: ${{ secrets.VERCEL_WEEKLY_REBUILD_HOOK }}
        run: |
          curl -X POST "$VERCEL_WEEKLY_REBUILD_HOOK"
