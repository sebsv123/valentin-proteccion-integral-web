name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: ISFAS regression tests
        run: npm run test:isfas

      - name: Related validation
        run: npm run test:related

      - name: Hardening regression tests
        run: npm run test:hardening

      - name: Lead safety tests
        run: npm run test:leads

      - name: Build
        run: npm run build
